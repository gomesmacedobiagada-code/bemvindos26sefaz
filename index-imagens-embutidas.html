<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento Energia</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0057b8,#00bcd4);
    min-height:100vh;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

header{
    background:#004aad;
    color:#fff;
    text-align:center;
    padding:35px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:10px;
    opacity:.9;
}

.banner{
    background:#f3f8ff;
    text-align:center;
    padding:30px;
}

.banner img{
    width:180px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    text-decoration:none;
    color:#fff;
    padding:25px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.azul{background:#007bff;}
.verde{background:#28a745;}
.laranja{background:#ff9800;}
.vermelho{background:#dc3545;}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:65px;
    height:65px;
    background:#25D366;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    font-size:34px;
    color:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.botao{
    display:inline-block;
    margin-top:20px;
    background:#25D366;
    color:white;
    padding:14px 28px;
    border-radius:8px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.botao:hover{
    background:#1ebc57;
}
</style>

</head>
<body>

<div class="container">

<header>
<h1>⚡ Atendimento Energia</h1>
<p>Escolha o serviço desejado</p>
</header>

<div class="banner">

<svg width="180" height="180" viewBox="0 0 200 200">
<circle cx="100" cy="100" r="80" fill="#FFD54F"/>
<polygon points="105,35 60,110 95,110 75,165 140,85 105,85" fill="#fff"/>
</svg>

<br>

<a class="botao" href="https://wa.me/message/W2QVTO554UQEI1" target="_blank">
💬 Atendimento via WhatsApp
</a>

</div>

<div class="menu">

<a href="https://wa.me/message/W2QVTO554UQEI1" target="_blank" class="card azul">
📄<br><br>
2ª Via
</a>

<a href="https://wa.me/message/W2QVTO554UQEI1" target="_blank" class="card verde">
📧<br><br>
Fatura Digital
</a>

<a href="https://wa.me/message/W2QVTO554UQEI1" target="_blank" class="card laranja">
💰<br><br>
Negociação de Dívidas
</a>

<a href="https://wa.me/message/W2QVTO554UQEI1" target="_blank" class="card vermelho">
👨‍💼<br><br>
Fala com Atendente
</a>

</div>

<footer>
© 2026 - Central de Atendimento Energia
</footer>

</div>

<a class="whatsapp" href="https://wa.me/message/W2QVTO554UQEI1" target="_blank">
☎
</a>

</body>
</html>
