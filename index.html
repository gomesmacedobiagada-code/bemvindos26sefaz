  backdrop-filter:blur(8px);
  padding:40px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);

.logo{
  width:220px;

}

h2{
  color:#fff;
  margin-bottom:25px;
  font-size:24px;
}

.btn{
  display:block;
  width:100%;
  padding:16px;
  margin:12px 0;
  border:none;
  border-radius:12px;
  background:#0b6b3a;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  background:#0f8a4a;
  transform:translateY(-2px);
}

.btn:active{
  transform:scale(0.98);
}
