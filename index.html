<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cemig - 2ª Via de Fatura de Energia | Emita pelo WhatsApp</title>
<meta name="description" content="Solicite a 2ª via da sua fatura Cemig de forma rápida e segura pelo WhatsApp." />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root{
    --cemig-green:#00A859; --cemig-blue:#004A8F;
    --whatsapp:#25D366; --whatsapp-hover:#1ebe5a;
    --accent:#E6F7EE; --accent-fg:#1F6B4A;
  }
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2937;}
  .text-cemig-blue{color:var(--cemig-blue)!important;}
  .text-cemig-green{color:var(--cemig-green)!important;}
  .bg-gradient-hero{background:linear-gradient(135deg,var(--cemig-green),var(--cemig-blue));}
  .btn-whatsapp{background:var(--whatsapp);color:#fff;border:none;border-radius:999px;font-weight:600;padding:.65rem 1.5rem;box-shadow:0 8px 20px rgba(37,211,102,.35);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;}
  .btn-whatsapp:hover{background:var(--whatsapp-hover);color:#fff;transform:translateY(-2px);box-shadow:0 12px 26px rgba(37,211,102,.45);}
  .btn-whatsapp-lg{padding:.9rem 2rem;font-size:1.1rem;}
  .btn-outline-light-soft{border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;font-weight:600;padding:.65rem 1.5rem;backdrop-filter:blur(6px);}
  .btn-outline-light-soft:hover{background:rgba(255,255,255,.2);color:#fff;}
  .btn-white-pill{background:#fff;color:var(--cemig-green);border-radius:999px;font-weight:700;padding:.9rem 2rem;}
  .btn-white-pill:hover{background:rgba(255,255,255,.92);color:var(--cemig-green);}
  .top-bar{background:var(--cemig-blue);color:#fff;font-size:.875rem;}
  .header-sticky{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid #e5e7eb;}
  .badge-soft{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:.25rem .65rem;font-weight:600;font-size:.75rem;display:inline-flex;align-items:center;gap:.35rem;}
  .badge-soft .dot{width:6px;height:6px;border-radius:50%;background:var(--cemig-green);display:inline-block;}
  .invoice-card{border-radius:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);}
  .highlight-box{border:2px dashed rgba(0,168,89,.4);background:rgba(230,247,238,.5);border-radius:.9rem;}
  .service-card{border-radius:1rem;border:1px solid #e5e7eb;transition:all .25s;}
  .service-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -15px rgba(0,74,143,.25);}
  .service-icon{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;transition:all .25s;}
  .service-card:hover .service-icon{background:var(--cemig-green);color:#fff;}
  .step-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--cemig-green),var(--cemig-blue));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;}
  .chip{background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:.3rem 1rem;font-size:.875rem;font-weight:500;backdrop-filter:blur(6px);display:inline-block;}
  .trust-row{color:rgba(255,255,255,.92);font-size:.9rem;}
  .trust-row span{display:inline-flex;align-items:center;gap:.35rem;}
</style>
</head>
<body>
